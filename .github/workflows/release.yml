name: Build & Release APK

# Run it by hand (Actions -> Build & Release APK -> Run workflow) and the signed
# APK is built and uploaded to the latest release automatically. Pushing a v*
# tag does the same for that tag.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to upload to (blank = latest release)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        run: |
          # The ubuntu runner already ships the Android SDK and cmdline-tools.
          # The setup-android action's default "tools platform-tools" list
          # fails because the old `tools` package is gone, so install only
          # what this project needs with the sdkmanager already present.
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Decode signing keystores
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          base64 -d debug.keystore.base64 > debug.keystore

      - name: Read version from build.gradle.kts
        id: ver
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building ZYRAXON v$VERSION"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease \
            -x lintVitalRelease -x lintVitalAnalyzeRelease \
            --stacktrace

      - name: Collect artifacts
        id: apk
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          APK="app/build/outputs/apk/release/app-release.apk"
          NAME="ZYRAXON-v${VERSION}.apk"
          cp "$APK" "$RUNNER_TEMP/$NAME"
          (cd "$RUNNER_TEMP" && sha256sum "$NAME" > "$NAME.sha256")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -la "$RUNNER_TEMP/$NAME"

      - name: Verify the signature
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$RUNNER_TEMP/${{ steps.apk.outputs.name }}"

      - name: Resolve the release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG=$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName --jq '.[0].tagName')
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Uploading to release: $TAG"

      - name: Publish the APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          APK_NAME: ${{ steps.apk.outputs.name }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/$APK_NAME" "$RUNNER_TEMP/$APK_NAME.sha256" \
              --repo "${{ github.repository }}" --clobber
          else
            # `--notes-from-tag` cannot be combined with `--repo`, so the tag's
            # own annotation is read from the local repo and passed as a notes
            # file. Fetch the tag explicitly first: the checkout is shallow and
            # the annotation object is not guaranteed to be present. A tag with
            # no annotation falls back to a one-line note rather than an empty
            # release body.
            git fetch --force --tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null || true
            git tag -l --format='%(contents)' "$TAG" > "$RUNNER_TEMP/notes.md"
            if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
              echo "ZYRAXON $TAG" > "$RUNNER_TEMP/notes.md"
            fi
            gh release create "$TAG" "$RUNNER_TEMP/$APK_NAME" "$RUNNER_TEMP/$APK_NAME.sha256" \
              --repo "${{ github.repository }}" \
              --title "ZYRAXON $TAG" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - name: Job summary
        run: |
          {
            echo "### ZYRAXON v${{ steps.ver.outputs.version }} released"
            echo ""
            echo "- Tag: \`${{ steps.tag.outputs.tag }}\`"
            echo "- Asset: \`${{ steps.apk.outputs.name }}\`"
            echo "- sha256: \`$(cut -d' ' -f1 "$RUNNER_TEMP/${{ steps.apk.outputs.name }}.sha256")\`"
          } >> "$GITHUB_STEP_SUMMARY"
