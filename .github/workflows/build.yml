name: Build ZYRAXON

# One tag, four installers, one release. The tag is what the release is named
# after, so pushing v1.2.0 publishes v1.2.0 — nothing has to be renamed by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify (real browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The acceptance test drives a real Chromium over CDP, which is exactly
      # what the runner's preinstalled Chrome can do — no display needed.
      - name: Start the app
        run: node zyraxon.mjs --no-open --port 12000 > /tmp/zyraxon.log 2>&1 &

      - name: Wait for the health endpoint
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:12000/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "server never came up"; cat /tmp/zyraxon.log; exit 1

      - name: Run the end-to-end acceptance test
        run: node test/e2e.mjs 12000

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The APK is built without Gradle, straight against the SDK tools, so the
      # SDK has to be here with exactly the pieces build.sh reaches for.
      # android-actions/setup-android@v3 is not used: its bundled cmdline-tools
      # are no longer published, so the action fails before it installs
      # anything. The SDK is fetched and pinned here instead, and the runner
      # keeps ANDROID_HOME set for build.sh.
      - name: Set up Android SDK
        run: |
          set -e
          export ANDROID_HOME="$HOME/android-sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install build tools
        run: sdkmanager "build-tools;36.0.0" "platforms;android-34"

      # build.sh signs with the standard debug keystore, which a fresh runner
      # does not have. apksigner will not emit an unsigned APK, so without this
      # the job dies at step 6/6. Same alias and passwords build.sh expects.
      - name: Create the debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        run: bash android/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: zyraxon-apk
          path: android/zyraxon.apk
          if-no-files-found: error

  desktop:
    name: Desktop ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            target: --linux AppImage
            artifact: zyraxon-linux
          - os: windows-latest
            name: Windows
            target: --win nsis
            artifact: zyraxon-windows
          - os: macos-latest
            name: macOS
            target: --mac dmg
            artifact: zyraxon-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build installer
        working-directory: desktop
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # electron-builder tries to sign with a local identity if one exists;
          # CI has none, and failing there would hide a build that otherwise works.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.dmg
            desktop/dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List the files going out
        run: find dist -type f | sort

      # A release that already exists is replaced outright: the old assets were
      # broken, and half-updated downloads are worse than none. The tag itself
      # is kept so the version history stays in one place.
      - name: Replace the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # No tag was pushed, so take the version the manifests declare rather
            # than a hardcoded one that drifts every release.
            TAG="v$(node -p "require('./package.json').version")"
          fi
          # The tag stays: it triggered this run, and deleting it would leave
          # the version pointing at nothing. Only the release is replaced.
          gh release delete "$TAG" --yes --repo "${{ github.repository }}" || true
          gh release create "$TAG" --repo "${{ github.repository }}" \
            --title "ZYRAXON $TAG" \
            --notes-file .github/RELEASE_NOTES.md \
            dist/*
