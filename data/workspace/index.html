<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>আমার ওয়েবসাইট</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
  }
  .card {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(12px);
    border-radius: 24px;
    padding: 48px 40px;
    max-width: 480px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  h1 { font-size: 2.4rem; margin-bottom: 12px; }
  p { font-size: 1.1rem; opacity: 0.9; line-height: 1.6; margin-bottom: 24px; }
  .btn {
    display: inline-block;
    padding: 12px 28px;
    background: #fff;
    color: #764ba2;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 600;
    transition: transform .2s;
  }
  .btn:hover { transform: translateY(-2px); }
</style>
</head>
<body>
  <div class="card">
    <h1>স্বাগতম</h1>
    <p>এটি আমার তৈরি করা প্রথম ওয়েবসাইট। এখানে তুমি যা খুশি তা যোগ করতে পারো।</p>
    <a class="btn" href="#">শুরু করো</a>
  </div>
</body>
</html>
