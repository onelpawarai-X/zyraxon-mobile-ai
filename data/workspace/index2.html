<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>তোমার smile</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'Noto Sans Bengali', sans-serif;
    background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
  }
  .card {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 40px 30px;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  h1 { font-size: 2rem; margin-bottom: 8px; }
  p { font-size: 1.1rem; opacity: 0.9; margin-bottom: 25px; }
  .btn {
    display: inline-block;
    padding: 12px 28px;
    background: #fff;
    color: #ee5a24;
    border-radius: 30px;
    text-decoration: none;
    font-weight: 600;
    transition: transform .2s;
  }
  .btn:hover { transform: scale(1.05); }
</style>
</head>
<body>
  <div class="card">
    <h1>তোমার smile</h1>
    <p>তুমি যখন হাসলে, আমার দিনটা সফল।</p>
    <a class="btn" href="#more">আমি তোমার</a>
  </div>
</body>
</html>
